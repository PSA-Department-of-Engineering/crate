default_install_hook_types: [commit-msg]
repos:
    - repo: https://github.com/compilerla/conventional-pre-commit
      rev: v3.4.0
      hooks:
          - id: conventional-pre-commit
            stages: [commit-msg]
    - repo: local
      hooks:
          - id: no-co-authored-by
            name: no Co-authored-by trailer
            entry: '^[ \t\v\f]*Co-authored-by:'
            language: pygrep
            args: [--ignore-case]
            stages: [commit-msg]
