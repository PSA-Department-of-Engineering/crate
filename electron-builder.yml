appId: dev.chaos-architect.crate
productName: Crate
directories:
    output: release
# In-app updates (INT-DIST-003) read from a public releases repo, because this
# repo is private and an installed app cannot authenticate to it. CI copies the
# Setup installer, its blockmap and latest.yml there after each release.
publish:
    provider: github
    owner: PSA-Department-of-Engineering
    repo: crate-releases
files:
    - dist/**/*
    - dist-electron/**/*
    - package.json
extraResources:
    - from: node_modules/ffmpeg-static/ffmpeg.exe
      to: ffmpeg.exe
win:
    icon: build/icon.ico
    target:
        - target: portable
          arch:
              - x64
        - target: nsis
          arch:
              - x64
nsis:
    oneClick: false
    allowToChangeInstallationDirectory: true
    createDesktopShortcut: true
    createStartMenuShortcut: true
    artifactName: Crate-Setup-${version}.${ext}
portable:
    artifactName: Crate-Portable-${version}.${ext}
