appId: dev.chaos-architect.crate
productName: Crate
directories:
    output: release
files:
    - dist/**/*
    - dist-electron/**/*
    - package.json
extraResources:
    - from: node_modules/ffmpeg-static/ffmpeg.exe
      to: ffmpeg.exe
win:
    icon: build/icon.ico
    target:
        - target: portable
          arch:
              - x64
        - target: nsis
          arch:
              - x64
nsis:
    oneClick: false
    allowToChangeInstallationDirectory: true
    createDesktopShortcut: true
    createStartMenuShortcut: true
    artifactName: Crate-Setup-${version}.${ext}
portable:
    artifactName: Crate-Portable-${version}.${ext}
