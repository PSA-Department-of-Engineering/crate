INT-APP-001:
  version: 1.0.0
  status: active
  statement: "The desktop shell provides a secure ContextBridge IPC interface isolating Node.js filesystem operations from the renderer."
  derived_from:
    - REQ-APP-001
  test:
    scope: unit
    component: DesktopBridge
    type: contract
  criticality: critical
  rationale: "Ensures renderer has no direct Node.js execution while exposing necessary file operations."

INT-APP-002:
  version: 1.0.0
  status: active
  statement: "The desktop bridge detects attached removable USB and SD storage volumes and retrieves available drive space and filesystem paths."
  derived_from:
    - REQ-APP-001
  test:
    scope: unit
    component: VolumeScanner
    type: behavior
  criticality: high
  rationale: "Required for targeting removable storage for car synchronization."

INT-LIB-001:
  version: 1.0.0
  status: active
  statement: "The library ingestion service scans source directories and imports valid MP3 and FLAC files into the managed library structure."
  derived_from:
    - REQ-LIB-001
  test:
    scope: unit
    component: LibraryService
    type: behavior
  criticality: critical
  rationale: "Forms the core music catalog from local user files."

INT-LIB-002:
  version: 1.0.0
  status: active
  statement: "The library ingestion service gracefully isolates corrupted or unreadable audio files without crashing the import process."
  derived_from:
    - REQ-LIB-001
  test:
    scope: unit
    component: LibraryService
    type: invariant
  criticality: medium
  rationale: "Prevents batch scan failures when encountering damaged files."

INT-LIB-003:
  version: 1.0.0
  status: active
  statement: "The library query engine filters and searches tracks across artist, album, album artist, year, genre, track number, and duration fields."
  derived_from:
    - REQ-LIB-002
  test:
    scope: unit
    component: LibraryQueryEngine
    type: behavior
  criticality: high
  rationale: "Provides responsive multi-field search and filtering across large collections."

INT-LIB-004:
  version: 1.0.0
  status: active
  statement: "The library table supports sorting tracks ascending and descending by artist, album, title, track number, year, genre, and duration."
  derived_from:
    - REQ-LIB-002
  test:
    scope: unit
    component: LibraryTable
    type: behavior
  criticality: high
  rationale: "Allows users to organize and view their library in their preferred order."

INT-TAG-001:
  version: 1.0.0
  status: active
  statement: "The metadata tag service parses and writes ID3v2.3/ID3v2.4 tags on MP3 audio files with tag preservation."
  derived_from:
    - REQ-TAG-001
  test:
    scope: unit
    component: TagService
    type: contract
  criticality: critical
  rationale: "Ensures edits to MP3 metadata persist directly to files on disk."

INT-TAG-002:
  version: 1.0.0
  status: active
  statement: "The metadata tag service parses and writes Vorbis comments on FLAC audio files preserving audio stream integrity."
  derived_from:
    - REQ-TAG-001
  test:
    scope: unit
    component: TagService
    type: contract
  criticality: critical
  rationale: "Ensures edits to FLAC metadata persist directly to files on disk."

INT-TAG-003:
  version: 1.0.0
  status: active
  statement: "The tag editor allows editing individual track metadata fields and updates the corresponding file tags upon save."
  derived_from:
    - REQ-TAG-002
  test:
    scope: unit
    component: TagEditor
    type: behavior
  criticality: high
  rationale: "Supports precision editing of single audio tracks."

INT-TAG-004:
  version: 1.0.0
  status: active
  statement: "The tag editor supports multi-track selection and applies common tag updates across all selected files in one operation."
  derived_from:
    - REQ-TAG-002
  test:
    scope: unit
    component: BatchTagEditor
    type: behavior
  criticality: high
  rationale: "Enables fast batch updating of artist, album, year, or genre across entire albums."

INT-TAG-005:
  version: 1.0.0
  status: active
  statement: "The metadata service extracts embedded album art from MP3 APIC frames and FLAC PICTURE blocks and writes replacement image data."
  derived_from:
    - REQ-TAG-002
  test:
    scope: unit
    component: ArtworkManager
    type: behavior
  criticality: medium
  rationale: "Allows embedding and updating cover artwork directly within audio files."

INT-TAG-006:
  version: 1.0.0
  status: active
  statement: "The application executes all library and tag operations locally without making outbound network requests or transmitting telemetry."
  derived_from:
    - REQ-TAG-003
  test:
    scope: unit
    component: NetworkBoundary
    type: invariant
  criticality: critical
  rationale: "Guarantees complete user privacy and air-gapped offline operation."

INT-ORG-001:
  version: 1.0.0
  status: active
  statement: "The filesystem organizer structures library audio files into '<Artist>/<Album>/<Track#> <Title>.<ext>' folder and filename patterns."
  derived_from:
    - REQ-ORG-001
  test:
    scope: unit
    component: FilesystemOrganizer
    type: behavior
  criticality: critical
  rationale: "Enforces consistent car head unit compatible folder and file hierarchies."

INT-ORG-002:
  version: 1.0.0
  status: active
  statement: "The filesystem organizer formats multi-disc albums with subdirectories matching '<Artist>/<Album>/Disc <N> ...' matching reference car structure."
  derived_from:
    - REQ-ORG-001
    - REQ-ORG-002
  test:
    scope: unit
    component: FilesystemOrganizer
    type: behavior
  criticality: high
  rationale: "Maintains multi-disc album organization aligned with reference car layouts."

INT-ORG-003:
  version: 1.0.0
  status: active
  statement: "The filesystem organizer sanitizes path components by replacing illegal FAT32/exFAT characters with safe equivalents."
  derived_from:
    - REQ-ORG-001
  test:
    scope: unit
    component: PathSanitizer
    type: invariant
  criticality: high
  rationale: "Prevents filesystem errors when writing to USB/SD storage formatted with FAT32 or exFAT."

INT-PLY-001:
  version: 1.0.0
  status: active
  statement: "The audio playback engine manages playback state, queue ordering, seek position, shuffle randomization, and repeat modes."
  derived_from:
    - REQ-PLY-001
  test:
    scope: unit
    component: AudioEngine
    type: behavior
  criticality: critical
  rationale: "Provides comprehensive audio playback controls within the application."

INT-PLY-002:
  version: 1.0.0
  status: active
  statement: "The audio playback engine enumerates available audio output devices and routes playback stream to the selected sink ID."
  derived_from:
    - REQ-PLY-001
  test:
    scope: unit
    component: AudioSinkRouter
    type: behavior
  criticality: medium
  rationale: "Allows directing audio output to specific sound cards or DACs."

INT-PLY-003:
  version: 1.0.0
  status: active
  statement: "The persistent mini-player displays active track info and controls in the library view and expands into a dedicated media player view."
  derived_from:
    - REQ-PLY-002
  test:
    scope: unit
    component: PlayerView
    type: behavior
  criticality: high
  rationale: "Ensures seamless playback visibility across library management and full-screen player views."

INT-PLY-004:
  version: 1.0.0
  status: active
  statement: "The undocked secondary player window syncs playback controls, track progress, and volume bidirectionally with the main window over IPC."
  derived_from:
    - REQ-PLY-002
  test:
    scope: unit
    component: MultiWindowSync
    type: behavior
  criticality: high
  rationale: "Allows controlling playback on a secondary display while organizing library files on the primary monitor."

INT-PLST-001:
  version: 1.0.0
  status: active
  statement: "The playlist manager exports playlists to .m3u files containing relative paths from the library/target root to each audio file."
  derived_from:
    - REQ-PLST-001
  test:
    scope: unit
    component: PlaylistExporter
    type: behavior
  criticality: critical
  rationale: "Ensures exported M3U playlists work seamlessly across local folders and car head units."

INT-PLST-002:
  version: 1.0.0
  status: active
  statement: "The playlist exporter formats M3U files using CRLF line endings and UTF-8 or ANSI encoding matching car firmware specifications."
  derived_from:
    - REQ-PLST-001
  test:
    scope: unit
    component: PlaylistExporter
    type: contract
  criticality: high
  rationale: "Guarantees car head unit playlist parser compatibility."

INT-SYNC-001:
  version: 1.0.0
  status: active
  statement: "The car sync engine allows selecting sync targets scoped to the entire library, specific playlists, or specific albums."
  derived_from:
    - REQ-SYNC-001
  test:
    scope: unit
    component: CarSyncManager
    type: behavior
  criticality: critical
  rationale: "Provides flexibility to synchronize full music collections or curated subsets to removable media."

INT-SYNC-002:
  version: 1.0.0
  status: active
  statement: "The car sync engine performs incremental delta synchronization by comparing source and destination files and copying only modified or missing items."
  derived_from:
    - REQ-SYNC-002
  test:
    scope: unit
    component: DeltaSyncEngine
    type: behavior
  criticality: critical
  rationale: "Avoids slow full-library recopies to USB/SD drives on repeat sync runs."

INT-SYNC-003:
  version: 1.0.0
  status: active
  statement: "The car sync engine scans destination storage, identifies stale files not present in the active sync selection, and reports them for pruning."
  derived_from:
    - REQ-SYNC-002
  test:
    scope: unit
    component: StaleFileDetector
    type: behavior
  criticality: high
  rationale: "Keeps removable car media clean of deleted or deselected tracks."

INT-DIST-001:
  version: 1.0.0
  status: active
  statement: "The hosted web build on the Foundry hostname displays an honest desktop prerequisite state with installation and download guidance."
  derived_from:
    - REQ-DIST-001
  test:
    scope: unit
    component: WebHostShell
    type: contract
  criticality: high
  rationale: "Presents clear download instructions to web visitors without simulating impossible browser filesystem operations."

INT-DIST-002:
  version: 1.0.0
  status: active
  statement: "The release packaging pipeline produces portable Windows binaries accompanied by SHA-256 checksums and SmartScreen installation documentation without auto-updaters."
  derived_from:
    - REQ-DIST-002
  test:
    scope: unit
    component: PackagingContract
    type: contract
  criticality: high
  rationale: "Delivers verifiable portable desktop binaries without elevation or automatic update daemons."

INT-UI-001:
  version: 1.0.0
  status: active
  statement: "The user interface adheres to the locked visual identity tokens including pale/nude palette, emerald primary accent, 0.75rem border radius, and Nunito typography."
  derived_from:
    - REQ-UI-001
  test:
    scope: unit
    component: VisualTheme
    type: invariant
  criticality: high
  rationale: "Enforces consistent visual art direction matching customer approval across all UI components."
