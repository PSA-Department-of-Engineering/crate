name: build

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        uses: PSA-Department-of-Engineering/ci/.github/workflows/build.yml@main
        permissions:
            contents: write
            packages: write
        secrets: inherit

    package-windows:
        needs: build
        if: github.event_name == 'push'
        runs-on: windows-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - id: tag
              shell: bash
              run: echo "tag=$(git tag --points-at HEAD)" >> "$GITHUB_OUTPUT"

            - if: steps.tag.outputs.tag == ''
              shell: bash
              run: echo "No tag on HEAD; nothing to package."

            - if: steps.tag.outputs.tag != ''
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - if: steps.tag.outputs.tag != ''
              run: npm ci

            - if: steps.tag.outputs.tag != ''
              shell: bash
              run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
              env:
                  TAG: ${{ steps.tag.outputs.tag }}

            - if: steps.tag.outputs.tag != ''
              run: npm run build && npm run build:electron

            - if: steps.tag.outputs.tag != ''
              run: npx electron-builder --win --publish never

            - if: steps.tag.outputs.tag != ''
              shell: bash
              working-directory: release
              run: sha256sum *.exe > SHA256SUMS-windows.txt

            - if: steps.tag.outputs.tag != ''
              shell: bash
              run: gh release upload "${{ steps.tag.outputs.tag }}" release/*.exe release/SHA256SUMS-windows.txt --clobber
              env:
                  GH_TOKEN: ${{ github.token }}

            # In-app updates (INT-DIST-003): installed builds read their update
            # feed from a public releases repo, because this repo is private and
            # an installed app cannot authenticate to it. The release is created
            # as a draft and only published once every file is uploaded, so a
            # client never sees a version whose installer or latest.yml is missing.
            - if: steps.tag.outputs.tag != ''
              shell: bash
              working-directory: release
              env:
                  GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
                  TAG: ${{ steps.tag.outputs.tag }}
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                      echo "::warning::RELEASES_REPO_TOKEN is not set; not publishing the public update feed."
                      exit 0
                  fi
                  repo="PSA-Department-of-Engineering/crate-releases"
                  gh release create "$TAG" --repo "$repo" --title "$TAG" --notes "Crate $TAG" --draft || true
                  gh release upload "$TAG" --repo "$repo" "Crate-Setup-${TAG#v}.exe" "Crate-Setup-${TAG#v}.exe.blockmap" latest.yml --clobber
                  gh release edit "$TAG" --repo "$repo" --draft=false
