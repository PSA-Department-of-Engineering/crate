<div class="flex h-screen flex-col bg-background select-none">
  <!-- Desktop Window Titlebar -->
  <div class="flex h-8 items-center justify-between border-b border-border bg-card px-3 text-xs text-muted-foreground [-webkit-app-region:drag]">
    <div class="flex items-center gap-2">
      <div class="flex h-4 w-4 items-center justify-center rounded bg-primary text-primary-foreground text-[10px] font-bold">C</div>
      <span class="font-semibold text-foreground">Crate</span>
      <span class="text-[11px] text-muted-foreground">— Now Playing</span>
    </div>
    <div class="flex items-center gap-1 [-webkit-app-region:no-drag]">
      <button class="flex h-6 w-6 items-center justify-center rounded hover:bg-accent text-muted-foreground hover:text-foreground">
        <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 12H4"/></svg>
      </button>
      <button class="flex h-6 w-6 items-center justify-center rounded hover:bg-accent text-muted-foreground hover:text-foreground">
        <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      </button>
      <button class="flex h-6 w-6 items-center justify-center rounded hover:bg-destructive hover:text-destructive-foreground text-muted-foreground">
        <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <aside class="flex w-56 flex-col border-r border-border bg-card">
      <nav class="flex-1 space-y-0.5 px-2 py-3 text-sm">
        <a class="flex items-center gap-2.5 rounded-md px-3 py-2 text-muted-foreground hover:bg-accent hover:text-accent-foreground"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 19V6l12-3v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="15" r="3"/></svg>Library</a>
        <a class="flex items-center gap-2.5 rounded-md px-3 py-2 text-muted-foreground hover:bg-accent hover:text-accent-foreground"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13M9 9l12-2"/></svg>Playlists</a>
        <a class="flex items-center gap-2.5 rounded-md px-3 py-2 text-muted-foreground hover:bg-accent hover:text-accent-foreground"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>Car Sync</a>
        <a class="flex items-center gap-2.5 rounded-md px-3 py-2 text-muted-foreground hover:bg-accent hover:text-accent-foreground"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Settings</a>
      </nav>
      <div class="border-t border-border px-3 py-2 text-xs text-muted-foreground">Library: 2,847 tracks</div>
    </aside>

    <!-- Main: full player -->
    <main class="flex flex-1 flex-col items-center justify-center bg-background">
      <div class="flex flex-col items-center gap-6 max-w-md w-full px-8">
        <!-- Album art (flat warm surface, 1px subtle border, no gradient) -->
        <div class="w-72 h-72 rounded-2xl bg-card border border-border flex items-center justify-center">
          <svg class="h-24 w-24 text-muted-foreground/40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
            <path d="M9 19V6l12-3v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="15" r="3"/>
          </svg>
        </div>

        <!-- Track info -->
        <div class="text-center space-y-1">
          <h2 class="text-xl font-bold text-foreground">Midnight City</h2>
          <p class="text-sm text-muted-foreground">M83 • Hurry Up, We're Dreaming</p>
        </div>

        <!-- Progress -->
        <div class="w-full space-y-1">
          <div class="relative h-1.5 w-full rounded-full bg-border">
            <div class="absolute left-0 top-0 h-1.5 w-[42%] rounded-full bg-primary"></div>
            <div class="absolute top-1/2 -translate-y-1/2 h-3.5 w-3.5 rounded-full bg-primary border-2 border-card" style="left: 42%"></div>
          </div>
          <div class="flex justify-between text-xs text-muted-foreground">
            <span>1:42</span>
            <span>4:03</span>
          </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center gap-5">
          <button class="text-muted-foreground hover:text-foreground">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          </button>
          <button class="text-foreground hover:text-primary">
            <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.333 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z"/></svg>
          </button>
          <button class="flex h-14 w-14 items-center justify-center rounded-full bg-primary text-primary-foreground hover:bg-primary/90">
            <svg class="h-7 w-7" fill="currentColor" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
          </button>
          <button class="text-foreground hover:text-primary">
            <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M11.933 12.8a1 1 0 000-1.6L6.6 7.2A1 1 0 005 8v8a1 1 0 001.6.8l5.333-4zM19.933 12.8a1 1 0 000-1.6l-5.333-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.333-4z"/></svg>
          </button>
          <button class="text-muted-foreground hover:text-foreground">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/></svg>
          </button>
        </div>

        <!-- Volume & output -->
        <div class="flex items-center gap-3 w-full">
          <button class="text-muted-foreground hover:text-foreground"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/></svg></button>
          <div class="relative flex-1 h-1.5 rounded-full bg-border">
            <div class="absolute left-0 top-0 h-1.5 w-[70%] rounded-full bg-primary"></div>
          </div>
          <div class="flex items-center gap-1.5 rounded-lg border border-border bg-card px-2.5 py-1 text-xs text-muted-foreground">
            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            Speakers (Realtek)
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
